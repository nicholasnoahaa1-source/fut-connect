# Wider adapter for a second training pass if q_proj/v_proj-only underfits
# (e.g. high WER on out-of-vocabulary PT-BR jargon/names). See REPORT.md.
r: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - out_proj
  - fc1
  - fc2
bias: none
task_type: SEQ_2_SEQ_LM
